<!DOCTYPE html>
<html lang="en" style="background:#000">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dipnaked — membrane physics lab</title>
    <link rel="icon" href="../../../logo-v2.png" />
    <style>
        :root { color-scheme: dark; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }
        canvas { display: block; pointer-events: none; }
        #lab-caption {
            position: fixed;
            left: 16px;
            bottom: 14px;
            z-index: 10000;
            display: flex;
            gap: 10px;
            align-items: baseline;
            color: #666;
            font-size: 10px;
            line-height: 1;
            letter-spacing: .08em;
            text-transform: uppercase;
            user-select: none;
        }
        #lab-caption a { color: #999; text-decoration: none; }
        #lab-caption a:hover { color: #fff; }
        #config-status { color: #454545; }
        #restart-btn {
            position: fixed;
            top: 8px;
            right: 260px;
            z-index: 10000;
            padding: 8px 14px;
            border: 1px solid #444;
            border-radius: 2px;
            background: #1a1a1a;
            color: #ccc;
            font: 500 11px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: .04em;
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
        }
        #restart-btn:hover { border-color: #666; background: #2a2a2a; color: #fff; }
        #restart-btn:active { transform: translateY(1px); background: #0d0d0d; }
        @media (max-width: 620px) {
            #restart-btn { top: 8px; right: auto; left: 8px; }
            #lab-caption { max-width: calc(100vw - 32px); flex-wrap: wrap; }
        }
    </style>
</head>
<body data-membrane-lab>
    <button id="restart-btn" title="Reset the membrane and drop the sphere again">restart</button>
    <div id="lab-caption">
        <a href="/">dipnaked</a>
        <span>membrane physics lab</span>
        <span id="config-status">default config</span>
    </div>
    <script type="importmap">
    {
        "imports": {
            "three": "../vendor/three.module.min.js",
            "lil-gui": "../vendor/lil-gui.esm.min.js"
        }
    }
    </script>
    <script type="module" src="./membrane.js"></script>
</body>
</html>
