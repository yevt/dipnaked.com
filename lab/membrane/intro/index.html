<!DOCTYPE html>
<html lang="en" style="background:#000">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dipnaked — intro</title>
    <link rel="icon" href="../../../logo-v2.png" />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" />
    <link rel="stylesheet" href="../../../style.css" />
    <style>
        /* Membrane canvas overlay: fullscreen, transparent, above the layout.
           The zoom is rendered via the camera view offset — the canvas itself is
           never CSS-scaled, so the membrane stays at native resolution. */
        #membrane-canvas {
            position: fixed;
            inset: 0;
            z-index: 100;
            pointer-events: none;   /* layout stays clickable underneath */
        }
        /* Zoom wrapper: JS drives translate+scale every frame so the layout
           and the membrane pull back as one world. */
        #layout-zoom {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            transform-origin: 0 0;
            will-change: transform;
        }
        /* Dev restart button — always visible, next to the lil-gui panel */
        #restart-btn {
            position: fixed;
            top: 8px;
            right: 260px;
            z-index: 10000;
            background: #1a1a1a;
            color: #ccc;
            border: 1px solid #444;
            font: 500 11px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 8px 14px;
            cursor: pointer;
            user-select: none;
            border-radius: 2px;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }
        #restart-btn:hover  { background: #2a2a2a; border-color: #666; color: #fff; }
        #restart-btn:active { background: #0d0d0d; transform: translateY(1px); }
    </style>
</head>
<body>
    <div id="layout-zoom">
    <div class="center-block">
        <a href="/"><img src="../../../logo-v2.png" alt="dipnaked" class="logo" id="logo-img" /></a>
        <div class="text-block">
            <div class="brand-name"><a href="/">dipnaked</a></div>
            <div class="tagline">in affair with the abyss</div>
            <div class="links">
                <a href="/listen/">listen</a>
                <a href="https://www.youtube.com/@dipnaked" target="_blank" rel="noopener">watch</a>
                <a href="https://www.instagram.com/snailstrobe/" target="_blank" rel="noopener">look</a>
            </div>
        </div>
    </div>
    </div>

    <button id="restart-btn" title="Replay the intro">restart</button>

    <script type="importmap">
    {
        "imports": {
            "three": "../vendor/three.module.min.js",
            "lil-gui": "../vendor/lil-gui.esm.min.js"
        }
    }
    </script>
    <script type="module" src="./membrane.js"></script>
</body>
</html>
