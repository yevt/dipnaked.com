<!DOCTYPE html>
<html lang="en" style="background:#000">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dipnaked — intro dev</title>
    <link rel="icon" href="/logo.png" />
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; }
        /* Standalone restart button — always visible, positioned next to lil-gui's root
           panel (which docks top-right). Sits just to the left of the gui, at the top. */
        #restart-btn {
            position: fixed;
            top: 8px;
            right: 260px;              /* lil-gui default width is 245px + 15px gap */
            z-index: 10000;
            background: #1a1a1a;
            color: #ccc;
            border: 1px solid #444;
            font: 500 11px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 8px 14px;
            cursor: pointer;
            user-select: none;
            border-radius: 2px;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }
        #restart-btn:hover  { background: #2a2a2a; border-color: #666; color: #fff; }
        #restart-btn:active { background: #0d0d0d; transform: translateY(1px); }
    </style>
</head>
<body>
    <button id="restart-btn" title="Drop the sphere again">restart</button>
    <script type="importmap">
    {
        "imports": {
            "three": "../vendor/three.module.min.js",
            "lil-gui": "../vendor/lil-gui.esm.min.js"
        }
    }
    </script>
    <script type="module" src="./membrane.js"></script>
</body>
</html>
