<!doctype html>
<html lang="ru" data-layout="a">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>dipnaked</title>
    <link rel="icon" href="assets/spiral-three.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/BlackSquare-v69.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../h-girl/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" />
    <link rel="stylesheet" href="display-fonts.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="spiral-layout.css" />
    <link rel="stylesheet" href="trail-layout.css" />
    <script type="module" src="menu.js"></script>
</head>
<body>
    <main class="sheet">
        <div class="safe">
            <header class="brand">
                <div class="brand-type">
                    <h1 class="wordmark"><span data-glyph-form="2">d</span>ip<wbr class="brand-break">nake<span data-glyph-form="final-d">d</span></h1>
                    <p class="slogan" lang="en">in affair with the abyss</p>
                </div>
                <div class="logo-slot">
                    <div class="logo">
                        <div class="logo-water" data-print-clip>
                            <img src="assets/spiral-three.svg#water-only" alt="" width="384" height="384" />
                        </div>
                        <img src="assets/spiral-three.svg#tube-only" alt="" width="384" height="384" />
                    </div>
                </div>
            </header>

            <nav class="menu" aria-label="Линейки">
                <ul>
                    <li><a class="item" data-preview="streaming" href="/listen/">
                        <span class="word">стриминги</span><span class="sub">музыка</span></a></li>
                    <li><a class="item" data-preview="youtube" href="https://www.youtube.com/@dipnaked">
                        <span class="word">youtube</span><span class="sub">треки, гитара, фортепиано</span></a></li>
                    <li><a class="item" data-preview="snailstrobe" href="https://www.instagram.com/snailstrobe/">
                        <span class="word">snail<wbr>strobe</span><span class="sub">эксперименты с графикой</span></a></li>
                    <li><a class="item" data-preview="peek10x" href="https://www.instagram.com/peek10x/">
                        <span class="word">peek10x</span><span class="sub">фото, видео</span></a></li>
                    <li><a class="item" data-preview="debility.records" href="https://www.youtube.com/@debilityrecords">
                        <span class="word">debility.<wbr>records</span><span class="sub">философия творчества, рефлексия, процесс</span></a></li>
                    <li><a class="item" data-preview="lab" href="/lab/">
                        <span class="word">lab</span><span class="sub">опыты в браузере</span></a></li>
                    <li><a class="item" data-preview="telegram" href="https://t.me/dipnaked">
                        <span class="word">telegram</span><span class="sub">заметки, эссе</span></a></li>
                </ul>
            </nav>
        </div>
    </main>
    <script>
        {
            const options = new URLSearchParams(location.search);
            const root = document.documentElement;
            const layout = options.get('layout');
            if (options.get('ending') === 'turn') root.dataset.ending = 'turn';
            if (['a', 'void', 'spiral', 'trail', 'b', 'c'].includes(layout)) root.dataset.layout = layout;
            if (options.has('debug')) root.classList.add('debug');
            if (options.has('grid')) root.classList.add('show-grid');
            if (layout === 'void') {
                const list = document.querySelector('.menu ul');
                const center = document.createElement('li');
                center.className = 'menu-center';
                center.setAttribute('aria-hidden', 'true');
                center.append(document.querySelector('.logo-slot'));
                list.insertBefore(center, list.children[4]);
            }
            if (layout === 'trail') {
                if (options.get('sign') === 'under') {
                    root.dataset.sign = 'under';
                    const name = document.querySelector('.wordmark');
                    const link = document.createElement('a');
                    link.href = 'assets/spiral-three.svg';
                    link.dataset.preview = 'signature';
                    link.setAttribute('aria-description', 'Открыть знак dipnaked');
                    link.append(...name.childNodes);
                    name.append(link);
                }
                // Reading and keyboard navigation follow the same turn as the lettering.
                const list = document.querySelector('.menu ul');
                for (const id of ['debility.records', 'snailstrobe', 'peek10x', 'telegram', 'lab']) {
                    const row = list.querySelector('[data-preview="' + id + '"]')?.closest('li');
                    if (row) list.append(row);
                }
            }
        }
    </script>
</body>
</html>
