    <div id="app" inert>

    <header class="hud-top">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 10a8 8 0 1 1 1.4 7M4 4v6h6"/></svg>
        </button>
        <button class="icon-button" id="settings-button" aria-label="Настройки" aria-expanded="false" aria-controls="settings">
          <svg class="settings-symbol" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="#1b1b1b"/><circle cx="15" cy="17" r="3" fill="#1b1b1b"/></svg>
          <svg class="settings-close-symbol" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
        <button id="help-button" class="icon-button" aria-label="Справка" aria-controls="intro" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9 8a3 3 0 0 1 6 0c0 2-3 2-3 5"/><circle cx="12" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
    </header>

    <section class="intro" id="intro" aria-label="Справка" data-phase="hidden" hidden>
      <canvas id="help-art" width="304" height="192" aria-hidden="true"></canvas>
      <p class="sr-only" id="input-hint">wasd — движение; мышь — обзор</p>
      <button class="enter-button" id="enter" aria-label="начать" disabled></button>
    </section>

    <footer class="hud-bottom">
      <span class="performance"><span id="fps">—</span> <span>FPS</span></span>
      <span id="escape-hint" class="escape-hint" hidden>esc — освободить мышь / справка</span>
    </footer>
    <div class="crosshair" id="crosshair" hidden aria-hidden="true"></div>

    <div id="joystick" class="joystick" aria-label="Стик движения" role="application" hidden>
      <span class="joystick-axis axis-x"></span><span class="joystick-axis axis-y"></span><span class="joystick-knob" id="joystick-knob"></span>
    </div>

    <aside id="settings" class="settings" hidden aria-label="Настройки">
      <label for="quality">Качество изображения</label>
      <select id="quality"><option value="low">Экономия</option><option value="medium" selected>Среднее</option><option value="high">Высокое</option></select>
      <label for="brightness">Яркость света <output id="brightness-value">100%</output></label>
      <input id="brightness" type="range" min="30" max="200" value="100" step="5" />
